<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>幼兒彩虹調色盤</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background-color: #f0f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* 上方：佔據 70%+ 螢幕高度的不規則大調色盤 */
    .palette-container {
      position: relative;
      width: 94vw;
      height: 72vh; /* 佔螢幕 70% 以上 */
      margin-top: 1.5vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 不規則水彩畫板形狀 */
    .palette-area {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 60% 40% 50% 70% / 50% 60% 40% 50%; /* 不規則水彩有機形狀 */
      box-shadow: 0 15px 35px rgba(0,0,0,0.1), inset 0 0 40px rgba(0,0,0,0.03);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 8px solid #ffffff;
      transition: background-color 0.6s ease;
    }

    /* 調色盤內部顏料混合池 */
    .color-blob {
      width: 80%;
      height: 80%;
      border-radius: 45% 55% 63% 37% / 40% 50% 50% 60%;
      background-color: #ffffff;
      border: 6px dashed #e0e0e0;
      transition: background-color 0.5s ease, transform 0.2s ease;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.06);
    }

    /* 重置/清空按鈕 (無文字 Icon) */
    .reset-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, #ffed4a, #ffc107);
      border: 4px solid #ffffff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: transform 0.15s ease;
    }
    .reset-btn:active { transform: scale(0.85) rotate(-15deg); }
    .reset-btn svg { width: 45px; height: 45px; fill: #5d4037; }

    /* 下方：彩虹七色顏料區 */
    .paint-bar {
      width: 100vw;
      height: 23vh;
      background: #ffffff;
      border-top-left-radius: 35px;
      border-top-right-radius: 35px;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0 8px;
    }

    /* 彩虹顏料水滴塊 */
    .paint-drop {
      width: 12vw;
      max-width: 70px;
      height: 12vw;
      max-height: 70px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      cursor: grab;
      box-shadow: 0 8px 15px rgba(0,0,0,0.18), inset -3px -3px 8px rgba(0,0,0,0.15);
      transition: transform 0.15s ease;
      position: relative;
    }
    .paint-drop::after {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 25%;
      height: 25%;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }
    .paint-drop:active { transform: scale(1.2); cursor: grabbing; }

    /* 拖動中的浮動顏料 */
    .dragging-clone {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      width: 70px;
      height: 70px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.9;
      transform: translate(-50%, -50%) scale(1.25);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

  <!-- 上方：佔據 70%+ 螢幕高度的不規則大調色盤 -->
  <div class="palette-container">
    <div class="palette-area" id="dropZone">
      <!-- 重置水桶 Icon -->
      <button class="reset-btn" id="resetBtn" aria-label="Clear Palette">
        <svg viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
        </svg>
      </button>

      <div class="color-blob" id="colorBlob"></div>
    </div>
  </div>

  <!-- 下方：彩虹七色顏料區 (紅、橘、黃、綠、藍、靛、紫) -->
  <div class="paint-bar">
    <div class="paint-drop" data-rgb="255,0,0" style="background-color: #ff0000;"></div>     <!-- 紅 -->
    <div class="paint-drop" data-rgb="255,127,0" style="background-color: #ff7f00;"></div>   <!-- 橘 -->
    <div class="paint-drop" data-rgb="255,230,0" style="background-color: #ffe600;"></div>   <!-- 黃 -->
    <div class="paint-drop" data-rgb="0,200,80" style="background-color: #00c850;"></div>    <!-- 綠 -->
    <div class="paint-drop" data-rgb="0,150,255" style="background-color: #0096ff;"></div>   <!-- 藍 -->
    <div class="paint-drop" data-rgb="75,0,130" style="background-color: #4b0082;"></div>    <!-- 靛 -->
    <div class="paint-drop" data-rgb="148,0,211" style="background-color: #9400d3;"></div>   <!-- 紫 -->
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const colorBlob = document.getElementById('colorBlob');
    const resetBtn = document.getElementById('resetBtn');
    const paintDrops = document.querySelectorAll('.paint-drop');

    let mixedColors = [];

    // 重置調色盤
    function resetPalette() {
      mixedColors = [];
      colorBlob.style.backgroundColor = '#ffffff';
      colorBlob.style.border = '6px dashed #e0e0e0';
      
      resetBtn.style.transform = 'scale(1.25) rotate(-20deg)';
      setTimeout(() => resetBtn.style.transform = 'none', 200);
    }

    resetBtn.addEventListener('click', resetPalette);

    // 混色演算法
    function calculateMixedColor() {
      if (mixedColors.length === 0) return '#ffffff';

      let r = 0, g = 0, b = 0;
      mixedColors.forEach(color => {
        r += color[0];
        g += color[1];
        b += color[2];
      });

      r = Math.round(r / mixedColors.length);
      g = Math.round(g / mixedColors.length);
      b = Math.round(b / mixedColors.length);

      return `rgb(${r}, ${g}, ${b})`;
    }

    // 支援觸控與滑鼠拖拽
    paintDrops.forEach(drop => {
      drop.addEventListener('pointerdown', (e) => {
        const rgbStr = drop.getAttribute('data-rgb');
        const rgb = rgbStr.split(',').map(Number);
        const colorStyle = drop.style.backgroundColor;

        const clone = document.createElement('div');
        clone.className = 'dragging-clone';
        clone.style.backgroundColor = colorStyle;
        clone.style.left = `${e.clientX}px`;
        clone.style.top = `${e.clientY}px`;
        document.body.appendChild(clone);

        function onPointerMove(moveEvent) {
          clone.style.left = `${moveEvent.clientX}px`;
          clone.style.top = `${moveEvent.clientY}px`;
        }

        function onPointerUp(upEvent) {
          document.removeEventListener('pointermove', onPointerMove);
          document.removeEventListener('pointerup', onPointerUp);

          const rect = dropZone.getBoundingClientRect();
          if (
            upEvent.clientX >= rect.left &&
            upEvent.clientX <= rect.right &&
            upEvent.clientY >= rect.top &&
            upEvent.clientY <= rect.bottom
          ) {
            mixedColors.push(rgb);
            colorBlob.style.border = 'none';
            colorBlob.style.backgroundColor = calculateMixedColor();

            colorBlob.style.transform = 'scale(1.06)';
            setTimeout(() => colorBlob.style.transform = 'scale(1)', 180);
          }

          document.body.removeChild(clone);
        }

        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
      });
    });
  </script>
</body>
</html>
